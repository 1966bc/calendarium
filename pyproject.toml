[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "calendarium"
dynamic = ["version"]
description = "Date picker widget for Tkinter: day/month/year spinboxes with validation. One file, no dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Giuseppe Costanzi"}]
requires-python = ">=3.6"
keywords = ["tkinter", "ttk", "date", "date picker", "datepicker", "widget", "spinbox", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
]

[project.urls]
Homepage = "https://github.com/1966bc/calendarium"
Source = "https://github.com/1966bc/calendarium"
Changelog = "https://github.com/1966bc/calendarium/blob/master/CHANGELOG.md"
Issues = "https://github.com/1966bc/calendarium/issues"

[tool.setuptools]
py-modules = ["calendarium"]

[tool.setuptools.dynamic]
version = {attr = "calendarium.__version__"}
